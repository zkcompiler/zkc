name = "zkc_clean"
version = "0.0.0"
defaultTargets = ["ZkcClean", "ZkcCleanTests", "ZkcCleanTools"]

[leanOptions]
autoImplicit = false
warningAsError = true

[[require]]
name = "zkc_ir"
path = "../../ir"

[[require]]
name = "Clean"
git = "https://github.com/Verified-zkEVM/clean"
rev = "1a6c28426372bb99af79e533aa7b9a0788eff0d7"

[[require]]
name = "CompPoly"
git = "https://github.com/Verified-zkEVM/CompPoly"
rev = "1cb8f5cd0e22a8c9ec165000915c21d0f8e12525"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "56a005855ea17e0b0958f73ec801ae140b0a1679"

[[lean_lib]]
name = "ZkcClean"
roots = ["Zkc.Adapters.Clean"]
globs = ["Zkc.Adapters.Clean.+"]
allowNonModules = true

[[lean_lib]]
name = "ZkcCleanTests"
roots = ["Zkc.Tests.Clean"]
globs = ["Zkc.Tests.Clean.+"]
allowNonModules = true

[[lean_exe]]
name = "command-control"
root = "Zkc.Tests.Clean.Control"
supportInterpreter = true
allowNonModules = true

[[lean_lib]]
name = "ZkcCleanTools"
roots = ["Zkc.Tools.Clean"]
globs = ["Zkc.Tools.Clean.+"]
allowNonModules = true
