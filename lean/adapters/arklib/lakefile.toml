name = "zkc_arklib"
version = "0.0.0"
defaultTargets = ["ZkcArkLib", "ZkcArkLibTests"]

[leanOptions]
autoImplicit = false
warningAsError = true

[[require]]
name = "zkc_protocol"
path = "../../protocol"

[[require]]
name = "Arklib"
git = "https://github.com/Verified-zkEVM/ArkLib.git"
rev = "1e0241333c18d8b22cb68f9522da5f9fb88f9a06"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "56a005855ea17e0b0958f73ec801ae140b0a1679"

[[require]]
name = "VCVio"
git = "https://github.com/Verified-zkEVM/VCVio"
rev = "96754a37e739270ac5bb8fe7deaeafef6964b688"

[[require]]
name = "PolyFun"
git = "https://github.com/Verified-zkEVM/PolyFun"
rev = "a5edfe2dd24d9d76f9a13cc1f131b220617ad534"

[[require]]
name = "CompPoly"
git = "https://github.com/Verified-zkEVM/CompPoly"
rev = "1cb8f5cd0e22a8c9ec165000915c21d0f8e12525"

[[lean_lib]]
name = "ZkcArkLib"
roots = ["Zkc.Adapters.ArkLib"]
globs = ["Zkc.Adapters.ArkLib.+"]
requiresModuleSystem = true

[[lean_lib]]
name = "ZkcArkLibTests"
roots = ["Zkc.Tests.ArkLib"]
globs = ["Zkc.Tests.ArkLib.+"]
allowNonModules = true
