name = "zkc_core"
version = "0.0.0"
defaultTargets = ["ZkcCore", "ZkcCoreTools", "ZkcCoreTests", "core-tool"]

[leanOptions]
autoImplicit = false
warningAsError = true

[[lean_lib]]
name = "ZkcCore"
roots = ["Zkc.Core"]
globs = ["Zkc.Core.+"]
requiresModuleSystem = true

[[lean_lib]]
name = "ZkcCoreTools"
roots = ["Zkc.Tools.Core"]
globs = ["Zkc.Tools.Core.+"]
allowNonModules = true

[[lean_lib]]
name = "ZkcCoreTests"
roots = ["Zkc.Tests.Core"]
globs = ["Zkc.Tests.Core.+"]
allowNonModules = true

[[lean_exe]]
name = "core-tool"
root = "Zkc.Tools.Core.Main"
