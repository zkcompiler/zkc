name = "zkc_verification"
version = "0.0.0"
defaultTargets = ["ZkcVerification", "ZkcVerificationTools", "ZkcVerificationTests"]

[leanOptions]
autoImplicit = false
warningAsError = true

[[require]]
name = "zkc_ir"
path = "../ir"

[[require]]
name = "zkc_protocol"
path = "../protocol"

[[lean_lib]]
name = "ZkcVerification"
roots = ["Zkc.Verification"]
globs = ["Zkc.Verification.+"]
requiresModuleSystem = true

[[lean_lib]]
name = "ZkcVerificationTools"
roots = ["Zkc.Tools.Verification"]
globs = ["Zkc.Tools.Verification.+"]
allowNonModules = true

[[lean_lib]]
name = "ZkcVerificationTests"
roots = ["Zkc.Tests.Verification"]
globs = ["Zkc.Tests.Verification.+"]
allowNonModules = true

[[lean_exe]]
name = "command-generate-scalar-presentations"
root = "Zkc.Tools.Verification.Commands.GenerateScalarPresentations"
supportInterpreter = true
allowNonModules = true

[[lean_exe]]
name = "command-run-root-assembly"
root = "Zkc.Tools.Verification.Commands.RunRootAssembly"
supportInterpreter = true
allowNonModules = true
