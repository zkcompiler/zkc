name = "zkc_formal"
version = "0.0.0"
defaultTargets = ["ZkcFormal", "ZkcFormalTests", "ZkcFormalTools"]
testDriver = "«zkc-formal-audit»"

[leanOptions]
autoImplicit = false
warningAsError = true

[[require]]
name = "zkc_compiler"
path = "../compiler"

[[require]]
name = "mathlib"
scope = "leanprover-community"
git = "https://github.com/leanprover-community/mathlib4"
rev = "fc4f59e577feb1a4956671bc04ac18aaaf8cd842"

[[require]]
name = "VCVio"
git = "https://github.com/Verified-zkEVM/VCVio.git"
rev = "f1e63c780de398fb62206dd5890f27e1ad64e0e6"

[[lean_lib]]
name = "ZkcFormal"
roots = ["ZkcFormal"]
globs = ["ZkcFormal", "ZkcFormal.+"]
requiresModuleSystem = true

[[lean_lib]]
name = "ZkcFormalTools"
roots = ["ZkcFormalTools"]
globs = ["ZkcFormalTools", "ZkcFormalTools.+"]
allowNonModules = true

[[lean_lib]]
name = "ZkcFormalTests"
roots = ["ZkcFormalTests"]
globs = ["ZkcFormalTests", "ZkcFormalTests.+"]
allowNonModules = true

[[lean_exe]]
name = "zkc-formal-audit"
root = "ZkcFormalTools.Audit"
allowNonModules = true
needs = ["ZkcFormal", "ZkcFormalTests", "+ZkcFormalTools.DrawCharge:olean"]
