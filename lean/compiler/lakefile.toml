name = "zkc_compiler"
version = "0.0.0"
defaultTargets = ["ZkcCore", "ZkcCoreTools", "ZkcCoreTests", "ZkcFrontend", "ZkcFrontendTools",
  "ZkcFrontendTests", "ZkcAudit", "core-tool", "zkc-syntax", "zkc-check", "zkc-frontend-tests",
  "zkc-audit"]
# a hyphenated name is written in guillemets for Lake to resolve it
testDriver = "«zkc-frontend-tests»"

[leanOptions]
autoImplicit = false
warningAsError = true

[[lean_lib]]
name = "ZkcCore"
roots = ["Zkc.Core"]
globs = ["Zkc.Core", "Zkc.Core.+"]
requiresModuleSystem = true

[[lean_lib]]
name = "ZkcCoreTools"
roots = ["Zkc.Tools.Core"]
globs = ["Zkc.Tools.Core.+"]
allowNonModules = true

[[lean_lib]]
name = "ZkcCoreTests"
roots = ["Zkc.Tests.Core"]
globs = ["Zkc.Tests.Core.+"]
allowNonModules = true

[[lean_lib]]
name = "ZkcFrontend"
roots = ["Zkc.Frontend"]
globs = ["Zkc.Frontend", "Zkc.Frontend.+"]
requiresModuleSystem = true

[[lean_lib]]
name = "ZkcFrontendTools"
roots = ["Zkc.Tools.Frontend"]
globs = ["Zkc.Tools.Frontend", "Zkc.Tools.Frontend.+"]
allowNonModules = true

[[lean_lib]]
name = "ZkcFrontendTests"
roots = ["Zkc.Tests.Frontend"]
globs = ["Zkc.Tests.Frontend", "Zkc.Tests.Frontend.+"]
allowNonModules = true

# The audit of the libraries: only its checking function is in the library. The controls under
# `Zkc.Tools.Audit.Controls` are in no glob, and are built because the audit's executables import
# them.
[[lean_lib]]
name = "ZkcAudit"
roots = ["Zkc.Tools.Audit"]
globs = ["Zkc.Tools.Audit"]
allowNonModules = true

[[lean_exe]]
name = "core-tool"
root = "Zkc.Tools.Core.Main"

[[lean_exe]]
name = "zkc-syntax"
root = "Zkc.Tools.Frontend.Main"
allowNonModules = true

[[lean_exe]]
name = "zkc-check"
root = "Zkc.Tools.Frontend.CheckMain"
allowNonModules = true

[[lean_exe]]
name = "zkc-frontend-tests"
root = "Zkc.Tests.Frontend.Main"
allowNonModules = true

[[lean_exe]]
name = "zkc-audit"
root = "Zkc.Tools.Audit.Main"
allowNonModules = true
needs = ["ZkcCore", "ZkcFrontend", "ZkcCoreTests"]
