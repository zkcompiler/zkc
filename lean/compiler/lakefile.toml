name = "zkc_compiler"
version = "0.0.0"
defaultTargets = ["ZkcCore", "ZkcVocabulary", "ZkcSubject", "ZkcCoreTests", "ZkcVocabularyTests", "ZkcAudit",
  "zkc-audit"]
# the tests are checks that run when their libraries are built: building the tests of the core,
# which need the tests of the vocabulary, is the test
testDriver = "ZkcCoreTests"

[leanOptions]
autoImplicit = false
warningAsError = true

[[lean_lib]]
name = "ZkcCore"
roots = ["Zkc.Core"]
globs = ["Zkc.Core", "Zkc.Core.+"]
requiresModuleSystem = true

[[lean_lib]]
name = "ZkcVocabulary"
roots = ["Zkc.Vocabulary"]
globs = ["Zkc.Vocabulary", "Zkc.Vocabulary.+"]
requiresModuleSystem = true

[[lean_lib]]
name = "ZkcSubject"
roots = ["Zkc.Subject"]
globs = ["Zkc.Subject", "Zkc.Subject.+"]
requiresModuleSystem = true

# A command that asks the kernel to compute. Meta code, outside the audited libraries: what it
# adds to a module is checked by the kernel there.
[[lean_lib]]
name = "ZkcKernel"
roots = ["Zkc.Kernel"]
globs = ["Zkc.Kernel", "Zkc.Kernel.+"]
requiresModuleSystem = true

[[lean_lib]]
name = "ZkcCoreTests"
roots = ["Zkc.Tests.Core"]
globs = ["Zkc.Tests.Core.+"]
allowNonModules = true
needs = ["ZkcVocabularyTests"]

[[lean_lib]]
name = "ZkcVocabularyTests"
roots = ["Zkc.Tests.Vocabulary"]
globs = ["Zkc.Tests.Vocabulary.+"]
allowNonModules = true

[[lean_lib]]
name = "ZkcFrontend"
roots = ["Zkc.Frontend"]
globs = ["Zkc.Frontend", "Zkc.Frontend.+"]
requiresModuleSystem = true

[[lean_lib]]
name = "ZkcFrontendTools"
roots = ["Zkc.Tools.Frontend", "Zkc.Tools.WrittenKnowledge"]
globs = ["Zkc.Tools.Frontend.*", "Zkc.Tools.WrittenKnowledge"]
allowNonModules = true

[[lean_lib]]
name = "ZkcFrontendTests"
roots = ["Zkc.Tests.Frontend"]
globs = ["Zkc.Tests.Frontend", "Zkc.Tests.Frontend.+"]
allowNonModules = true

# Includes the executable and the negative controls it exercises.
[[lean_lib]]
name = "ZkcAudit"
roots = ["Zkc.Tools.Audit"]
globs = ["Zkc.Tools.Audit.*"]
allowNonModules = true

[[lean_exe]]
name = "zkc-syntax"
root = "Zkc.Tools.Frontend.Main"
allowNonModules = true

[[lean_exe]]
name = "zkc-check"
root = "Zkc.Tools.Frontend.CheckMain"
allowNonModules = true

[[lean_exe]]
name = "zkc-frontend-tests"
root = "Zkc.Tests.Frontend.Main"
allowNonModules = true

[[lean_exe]]
name = "zkc-audit"
root = "Zkc.Tools.Audit.Main"
allowNonModules = true
needs = ["ZkcCore", "ZkcVocabulary", "ZkcSubject", "ZkcCoreTests", "ZkcVocabularyTests"]

[[lean_exe]]
name = "zkc-knowledge"
root = "Zkc.Tools.WrittenKnowledge"
allowNonModules = true
