name = "zkc_arklib"
version = "0.0.0"
defaultTargets = ["ZkcArkLib", "ZkcArkLibTests"]

[leanOptions]
autoImplicit = false
warningAsError = true

[[require]]
name = "zkc"
path = "../.."

[[require]]
name = "Arklib"
git = "https://github.com/Verified-zkEVM/ArkLib.git"
rev = "3f3f045dd295834c262bd6f0d9dfdfee07cc8e76"

# Select the main package's Mathlib revision over upstream transitive pins.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "0df444a360eaa60ab8c11dca51a86af692955474"

[[lean_lib]]
name = "ZkcArkLib"
roots = ["ZkcArkLib"]
globs = ["ZkcArkLib.+"]

[[lean_lib]]
name = "ZkcArkLibTests"
roots = ["TestsArkLib"]
globs = ["TestsArkLib.+"]
