name = "zkc_arklib"
version = "0.0.0"
defaultTargets = ["ZkcArkLib", "ZkcArkLibTests"]

[leanOptions]
autoImplicit = false
warningAsError = true

[[require]]
name = "Arklib"
git = "https://github.com/Verified-zkEVM/ArkLib.git"
rev = "a93ee1ebbbf7b6b939ba3dd1c6115d33c92a4253"

[[require]]
name = "VCVio"
git = "https://github.com/Verified-zkEVM/VCVio"
rev = "afa6593f15e1e79ecb3cf22fc56191cecb452bb0"

[[require]]
name = "CompPoly"
git = "https://github.com/Verified-zkEVM/CompPoly"
rev = "df591bb8c6745126d1d72f5243faae3022b0432a"

[[require]]
name = "PolyFun"
git = "https://github.com/Verified-zkEVM/PolyFun"
rev = "3710d71b28404a151b8d1f0ce080ea448778dec0"

[[require]]
name = "zkc_security"
path = "../../security"

[[require]]
name = "zkc"
path = "../.."

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "d13f23b723b8a846827a245b89c10fc7d3f11612"

[[lean_lib]]
name = "ZkcArkLibTests"
roots = ["TestsArkLib"]
globs = ["TestsArkLib.+"]
allowNonModules = true

[[lean_lib]]
name = "ZkcArkLib"
globs = ["ZkcArkLib.+"]
requiresModuleSystem = true
