name = "zkc_clean"
version = "0.0.0"
defaultTargets = ["ZkcClean", "ZkcCleanTests", "CleanExamples"]

[leanOptions]
autoImplicit = false
warningAsError = true

[[require]]
name = "zkc"
path = "../.."

[[require]]
name = "Clean"
git = "https://github.com/Verified-zkEVM/clean"
rev = "b449bf590f93e13827c3c7e747e392d6969aa380"

# Keep the shared polynomial library aligned with the ArkLib integration.
[[require]]
name = "CompPoly"
git = "https://github.com/Verified-zkEVM/CompPoly"
rev = "a09455a22fea4623a2a1c5b363cf6efc61486a83"

# Select the main package's Mathlib revision over upstream transitive pins.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "0df444a360eaa60ab8c11dca51a86af692955474"

# Clean's library requires module-system importers. A `module` file cannot
# import the main zkc library, which is not a module-system package, so these
# libraries import Clean from ordinary files.
[[lean_lib]]
name = "ZkcClean"
roots = ["ZkcClean"]
globs = ["ZkcClean.+"]
allowNonModules = true

[[lean_lib]]
name = "ZkcCleanTests"
roots = ["TestsClean"]
globs = ["TestsClean.+"]
allowNonModules = true

[[lean_lib]]
name = "CleanExamples"
roots = ["CleanExamples"]
allowNonModules = true
