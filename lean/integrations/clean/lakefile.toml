name = "zkc_clean"
version = "0.0.0"
defaultTargets = ["ZkcClean", "ZkcCleanTests", "CleanExamples"]

[leanOptions]
autoImplicit = false
warningAsError = true

[[require]]
name = "zkc"
path = "../.."

[[require]]
name = "Clean"
git = "https://github.com/Verified-zkEVM/clean"
rev = "b449bf590f93e13827c3c7e747e392d6969aa380"

# Keep the shared polynomial library aligned with the ArkLib integration.
[[require]]
name = "CompPoly"
git = "https://github.com/Verified-zkEVM/CompPoly"
rev = "df591bb8c6745126d1d72f5243faae3022b0432a"

# Select the main package's Mathlib revision over upstream transitive pins.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "d13f23b723b8a846827a245b89c10fc7d3f11612"

# The adapter is kept separate from protocol security and uses the shared pins.
[[lean_lib]]
name = "ZkcClean"
roots = ["ZkcClean"]
globs = ["ZkcClean.+"]
allowNonModules = true

[[lean_lib]]
name = "ZkcCleanTests"
roots = ["TestsClean"]
globs = ["TestsClean.+"]
allowNonModules = true

[[lean_lib]]
name = "CleanExamples"
roots = ["CleanExamples", "CleanExamplesAudit"]
allowNonModules = true
