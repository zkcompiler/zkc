name = "zkc_security"
version = "0.0.0"
defaultTargets = ["ZkcSecurity", "ZkcSecurityTools", "ZkcSecurityExamples", "ZkcSecurityTests"]

[leanOptions]
autoImplicit = false
warningAsError = true

[[require]]
name = "VCVio"
git = "https://github.com/Verified-zkEVM/VCVio"
rev = "96754a37e739270ac5bb8fe7deaeafef6964b688"

[[require]]
name = "CompPoly"
git = "https://github.com/Verified-zkEVM/CompPoly"
rev = "1cb8f5cd0e22a8c9ec165000915c21d0f8e12525"

[[require]]
name = "PolyFun"
git = "https://github.com/Verified-zkEVM/PolyFun"
rev = "a5edfe2dd24d9d76f9a13cc1f131b220617ad534"

[[require]]
name = "zkc"
path = ".."

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "56a005855ea17e0b0958f73ec801ae140b0a1679"

[[lean_lib]]
name = "ZkcSecurityTests"
roots = ["TestsSecurity"]
globs = ["TestsSecurity.+"]
allowNonModules = true

[[lean_lib]]
name = "ZkcSecurity"
globs = ["ZkcSecurity.+"]
requiresModuleSystem = true

[[lean_lib]]
name = "ZkcSecurityTools"
globs = ["ZkcSecurityTools.+"]
requiresModuleSystem = true

[[lean_lib]]
name = "ZkcSecurityExamples"
globs = ["ZkcSecurityExamples.+"]
requiresModuleSystem = true
