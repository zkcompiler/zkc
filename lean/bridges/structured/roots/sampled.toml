schema = "zkc.component-roots/0"
# Root-specific source and theorem selections. Structural assembly is generic.
model_module = "ZkcSecurity.Domains.PrimeField"
model = "ZkcSecurity.Domains.PrimeField.blsScalarModel"
sampling = "ZkcSecurity.Domains.PrimeField.rawSampleable blsModulus"
field_type = "ZMod blsModulus"
group_type = "ZMod blsModulus"
capabilities = "ZkcSecurity.Domains.PrimeField.blsCapabilities original (by decide +kernel)"

[[root]]
name = "SchnorrRandomized"
source = "examples/projects/schnorr/main.zkc"
entry = "example::Proof"
modules = { schnorr = "libraries/protocols/sigma/schnorr/lib.zkc" }
target = "knowledge"
method = "sigma"

[[root]]
name = "SchnorrAndRandomized"
source = "examples/projects/sigma/main.zkc"
entry = "example::AndProof"
modules = { sigma = "libraries/protocols/sigma/compositions/lib.zkc" }
target = "knowledge"
method = "sigma"

[[root]]
name = "SchnorrAndAliased"
source = "examples/projects/sigma/aliased/main.zkc"
entry = "example::Proof"
modules = { sigma = "libraries/protocols/sigma/compositions/lib.zkc" }
target = "knowledge"
method = "sigma"

[[root]]
name = "SampledAbort"
source = "examples/projects/sampled-abort/main.zkc"
entry = "example::Proof"
modules = {}
target = "equality"
method = "direct"
proof_module = "ZkcSecurity.Examples.SampledAbort"
proof_name = "ZkcSecurity.Examples.SampledAbort.compiled_ideal_complete"
error_bound = "1 / (Fintype.card (ZMod blsModulus) : ENNReal)"
error_expression = '.binary .div (.natural 1) (.application "cardinality" none [(none, .reference "bls12-381.fr")])'

[[root]]
name = "SequentialSigma"
source = "lean/bridges/structured/fixtures/sequential-sigma.zkc"
entry = "example::Proof"
modules = { schnorr = "libraries/protocols/sigma/schnorr/lib.zkc", sigma = "libraries/protocols/sigma/compositions/lib.zkc" }
target = "equality"
method = "sigma"
