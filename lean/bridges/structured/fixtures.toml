# Retained subjects of the structured differential suites.
#
# Each table names one retained export: the suite that regenerates and compares
# it, the closed protocol subject it exports, its sources and the Lean data module of the retained
# snapshot (`ZkcExamples.Structured.<data>Data`). Sources are a module map
# (`modules`), a project manifest (`project`), or an explicit fixture manifest
# (`manifest`) selecting its library closure. The suites read this file;
# the cases they run over each subject stay in their code. Subject manifests in
# `lean/subjects` may also regenerate a retained export they own.

[schnorr-interactive]
suite = "open_protocol"
subject = "schnorr::Schnorr<example::G>"
modules = { example = "examples/projects/schnorr/main.zkc", schnorr = "libraries/protocols/sigma/schnorr/lib.zkc" }
data = "SchnorrInteractive"

[schnorr-helpers]
suite = "open_protocol"
subject = "schnorr_forms::HelpersProtocol"
modules = { schnorr_forms = "lean/bridges/common/fixtures/schnorr-forms.zkc" }
data = "SchnorrHelpers"

