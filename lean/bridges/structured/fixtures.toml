# The inlining suite exports an original and a prepared candidate of each
# fixture's closed protocol; `data` prefixes their `Original` and `Candidate` data.
[schnorr-response]
subject = "schnorr_response::Response"
suite = "inlining"
module = "schnorr_response"
data = "SchnorrResponse"

[sumcheck-claim]
subject = "sumcheck_claim::Claim"
suite = "inlining"
module = "sumcheck_claim"
data = "SumcheckClaim"
