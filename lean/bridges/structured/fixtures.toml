# Retained subjects of the structured differential suites.
#
# Each table names one retained export: the suite that regenerates and compares
# it, the Entry it exports, its sources and the Lean data module of the retained
# snapshot (`ZkcExamples.Structured.<data>Data`). Sources are a module map
# (`modules`), a project manifest (`project`), or a caller module compiled with
# every `libraries/zkc` module (`library_caller`). The suites read this file;
# the cases they run over each subject stay in their code. Subject manifests in
# `lean/subjects` may also regenerate a retained export they own.

[schnorr-interactive]
suite = "open_protocol"
entry = "example::Interactive"
modules = { example = "examples/projects/schnorr/main.zkc", schnorr = "libraries/schnorr/lib.zkc" }
data = "SchnorrInteractive"

[schnorr-helpers]
suite = "open_protocol"
