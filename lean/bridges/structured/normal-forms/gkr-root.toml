# The root of the original GKR Entry (`gkr::Gkr`): its typed body with the
# output-point, layer and line-coefficient callbacks named, read from the
# retained export of the admitted unit.
fixture = "lean/bridges/structured/fixtures/gkr-source.json"
output = "lean/ZkcExamples/Structured/GkrRootNormalForms.lean"
namespace = "ZkcExamples.Structured.GkrRootNormalForms"
summary = "The root of the original GKR Entry and its participants' normal forms"
imports = ["ZkcExamples.Structured.GkrRoundsNormalForms", "ZkcExamples.Structured.GkrInputNormalForms", "ZkcExamples.Structured.NormalFormSteps"]
open = ["SumcheckVerifierHelpers"]
helper_modules = ["lean/ZkcExamples/Structured/GkrSourceBodies.lean"]

[bodies]
name = "gkr"
# Each callback is named by a source label one of its own actions carries.
callbacks = { output = "output", layer = "left", coefficient = "line_coefficient" }
views = "GkrSourceViews"
declaration = "gkr"

[unit]
name = "GkrSourceViews.unit"
views = "GkrSourceViews"
helpers = "plainHelpers (F := F) (G := G) GkrSourceViews.unit"
program = "GkrSourceViews.program"

# One output-point challenge: drawn by the verifier and delivered to the prover.
[[shared]]
repeat = "output"
body = "outputBody"
function = "outputFn"

[[shared.roles]]
role = 1
name = "verifierOutput"
proof = "normal-form"
fold = true
slots = [{ name = "point", mode = "optional" }]
captures = [{ name = "service", mode = "optional" }]
strict = ["*"]

[[shared.roles]]
role = 0
name = "proverOutput"
proof = "normal-form"
fold = true
slots = [{ name = "point", mode = "optional" }]
captures = [{ name = "service", mode = "optional" }]
strict = ["*"]

# One further coefficient of a layer's line polynomial.
[[shared]]
repeat = "coefficient"
body = "coefficientBody"
function = "coefficientFn"

[[shared.roles]]
role = 1
name = "verifierCoefficient"
proof = "normal-form"
fold = true
slots = [{ name = "coefficients", mode = "optional" }]
captures = [{ name = "line", mode = "optional" }]
strict = ["*"]

[[shared.roles]]
role = 0
name = "proverCoefficient"
proof = "normal-form"
fold = true
slots = []
captures = [{ name = "line", mode = "optional" }]
strict = ["*"]

# One layer: the two layer Sumcheck applications, the line polynomial, the wiring
# check and the line challenge.
[[shared]]
repeat = "layer"
body = "layerBody"
function = "layerFn"

[[shared.applications]]
name = "left"
declaration = "rounds"
body = "GkrRoundsNormalForms.roundsBody"
raw = "GkrRoundsNormalForms.roundsBody_raw"
callee = "lean/bridges/structured/normal-forms/gkr-rounds.toml"
function = "roundsFn"
results = ["point", "", "", "", "", "point", "value"]
roles.verifierRounds = {}
roles.proverRounds = {}

[[shared.applications]]
name = "right"
declaration = "rounds"
body = "GkrRoundsNormalForms.roundsBody"
raw = "GkrRoundsNormalForms.roundsBody_raw"
callee = "lean/bridges/structured/normal-forms/gkr-rounds.toml"
function = "roundsFn"
results = ["point", "", "", "", "", "point", "value"]
roles.verifierRounds = {}
roles.proverRounds = {}

[[shared.roles]]
role = 1
name = "verifierLayer"
proof = "normal-form"
fold = true
slots = [{ name = "point", mode = "optional" }, { name = "claim", mode = "optional" }]
captures = [{ name = "inputs", mode = "optional" }, { name = "add", mode = "optional" },
            { name = "mul", mode = "optional" }, { name = "layers", mode = "optional" },
            { name = "selector", mode = "optional" }, { name = "width", mode = "optional" },
            { name = "service", mode = "optional" }]
strict = ["*"]

[[shared.roles]]
role = 0
name = "proverLayer"
proof = "normal-form"
fold = true
slots = [{ name = "point", mode = "optional" }]
captures = [{ name = "inputs", mode = "optional" }, { name = "add", mode = "optional" },
            { name = "mul", mode = "optional" }, { name = "layers", mode = "optional" },
            { name = "selector", mode = "optional" }, { name = "width", mode = "optional" },
            { name = "service", mode = "optional" }]
strict = ["*"]


# The whole root: the output point, the layers and the input check.
[[shared]]
body = "gkrBody"
function = "gkrFn"
declaration = "gkr"
raw = "gkrBody_raw"

[[shared.applications]]
name = "input"
declaration = "sourceProtocol80"
body = "GkrInputNormalForms.inputBody"
raw = "GkrInputNormalForms.inputBody_raw"
callee = "lean/bridges/structured/normal-forms/gkr-input.toml"
function = "inputFn"
results = ["accepted"]
roles.verifier = {}

[[shared.roles]]
role = 1
name = "verifier"
proof = "normal-form"
inputs = [{ name = "inputs", mode = "optional" }, { name = "outputs", mode = "optional" },
          { name = "add", mode = "optional" }, { name = "mul", mode = "optional" },
          { name = "layers", mode = "optional" }, { name = "selector", mode = "optional" },
          { name = "width", mode = "optional" }, { name = "service", mode = "optional" }]
strict = ["*"]
