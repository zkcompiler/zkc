# Participant normal forms of the original-stage `sigma::ChaumPedersen` Entry.
fixture = "lean/bridges/structured/fixtures/chaum-pedersen.json"
output = "lean/ZkcExamples/Structured/ChaumPedersenNormalForms.lean"
namespace = "ZkcExamples.Structured.ChaumPedersenNormalForms"
imports = ["ZkcExamples.Structured.ChaumPedersenViews", "Zkc.Source.Structured.NormalForm.Presentation", "Zkc.Source.Structured.ReplyScript",
           "Zkc.Source.Structured.ContractExecution", "Zkc.Source.Structured.ContractElaboration",
           "Zkc.Source.Structured.ContractObligations",
           "Mathlib.Algebra.Field.Basic", "Mathlib.Algebra.Module.Defs"]
open = ["ChaumPedersenViews"]
options = ["smartUnfolding false"]
carrier = "Field"

[sites]
s0 = "nonceSite"

[root]
inputs = ["firstBase", "firstKey", "secondBase", "secondKey", "witness", "nonces", "challenges"]
roles = ["prover", "verifier"]
proof = "normal-form"
body = "ChaumPedersenBodies.interactiveBody"

[contract]
clause = "knowledge"
