# Participant normal forms of the original-stage interactive Schnorr Entry.
fixture = "lean/bridges/structured/fixtures/schnorr-interactive.json"
output = "lean/ZkcExamples/Structured/SchnorrInteractiveNormalForms.lean"
namespace = "ZkcExamples.Structured.SchnorrInteractiveNormalForms"
imports = ["ZkcExamples.Structured.SchnorrInteractive", "Zkc.Source.Structured.ReplyScript",
           "Zkc.Source.Structured.ContractExecution", "Zkc.Source.Structured.ContractElaboration",
           "Zkc.Source.Structured.ContractObligations",
           "Mathlib.Algebra.Field.Basic", "Mathlib.Algebra.Module.Defs"]
open = ["SchnorrInteractive"]
options = ["smartUnfolding false"]
carrier = "Field"

[sites]
s0 = "nonceSite"

[root]
inputs = ["base", "key", "witness", "nonces", "challenges"]
roles = ["prover", "verifier"]
proof = "kernel"

[contract]
clause = "knowledge"
