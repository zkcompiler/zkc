# Participant normal forms of the repacked Sumcheck reduction root: the same
# `Reduce` application as the retained reduction, with the root's ports in a
# different order.
fixture = "lean/bridges/structured/fixtures/sumcheck-repacked.json"
output = "lean/ZkcExamples/Structured/SumcheckRepackedNormalForms.lean"
namespace = "ZkcExamples.Structured.SumcheckRepackedNormalForms"
summary = "Participant normal forms of the repacked Sumcheck reduction root"
imports = ["ZkcExamples.Structured.SumcheckRepackedViews", "ZkcExamples.Structured.SumcheckRoundNormalForms",
           "ZkcExamples.Structured.NormalFormSteps"]
open = ["SumcheckVerifierHelpers", "PrimitiveLibrary"]
helper_modules = ["lean/ZkcExamples/Structured/SumcheckRepackedBodies.lean",
                  "lean/ZkcExamples/Structured/SumcheckReduceBodies.lean",
                  "lean/ZkcExamples/Structured/SumcheckHelperBodies.lean",
                  "lean/ZkcExamples/Structured/MapFirstBodies.lean"]

[unit]
name = "SumcheckRepackedViews.unit"
views = "SumcheckRepackedViews"
helpers = "plainHelpers (F := F) (G := G) SumcheckRepackedViews.unit"
program = "SumcheckRepackedViews.program"

[[shared]]
declaration = "run"
body = "SumcheckRepackedBodies.runBody"
function = "runFn"

[[shared.applications]]
declaration = "reduce"
body = "SumcheckVerifierBodies.reduceBody 4"
callee = "lean/bridges/structured/normal-forms/sumcheck-round.toml"
function = "reduceFn"
arguments = { U = "SumcheckRepackedViews.unit", maximum = "4" }
roles.verifierReduce = { bodies = "bodies" }
roles.proverReduce = { bodies = "bodies", countBound = "Nat.lt_trans shape.2.1 (by decide +kernel)", roundsBound = "Nat.lt_of_le_of_lt enough (Nat.lt_trans shape.2.1 (by decide +kernel))", enough = "enough" }

[[shared.roles]]
role = 1
name = "verifier"
binders = "(bodies : SumcheckVerifierHelpers.Bodies SumcheckRepackedViews.unit.definitions)"
inputs = [{ name = "claim", mode = "optional" }, { name = "count", mode = "optional" },
          { name = "dimension", mode = "absent" }, { name = "raw", mode = "absent" },
          { name = "service", mode = "optional" }]
laws.valuesHelper = { term = "values_optional SumcheckRepackedViews.unit bodies {0} {1} {2}", results = ["{0}"], components = true }

[[shared.roles]]
role = 0
name = "prover"
binders = "(bodies : SumcheckUnitContracts.Bodies SumcheckRepackedViews.unit.definitions)"
premises = "(shape : HasShape raw count 1) (bound : raw.length < indexLimit) (enough : rounds ≤ count)"
inputs = [{ name = "claim", mode = "absent" }, { name = "rounds" }, { name = "count" }, { name = "raw" },
          { name = "service", mode = "absent" }]
laws.tableHelper = { term = "SumcheckProverLaws.table_present SumcheckRepackedViews.unit bodies {0} {1} shape bound", results = ["{0}", "{1}", "{2}"] }
laws.valuesHelper = { term = "values_optional SumcheckRepackedViews.unit ⟨bodies.empty, bodies.append, bodies.width, bodies.«variables», bodies.values⟩ {0} {1} {2}", results = ["{0}"], components = true }
