# The claims ledger: the "What is proved" table of lean/README.md, row by row.
#
# Each row states one published claim, its owning documents (links relative to
# lean/README.md) and the theorems that carry it. claims.lock.json records each
# cited theorem's package, module and statement hashes; check_records.py fails
# when a cited theorem disappears, its statement hashes change, or it depends on
# an axiom outside propext, Classical.choice and Quot.sound. After reviewing a
# row whose statement changed, rewrite the lock with
# `python3 lean/checks/check_records.py --package applications --write`.
schema = "zkc.claims/0"

