Soundness over typed query sites: for any validator signature with a transcript interface whose sites decode the raw answer of their occurrence, possibly refusing, each oracle key is charged its site's error under the site's realized decoding law (exact, masking with refusal, KoalaBear low-bit masks, BLS12-381 reduction, proof-of-work-gated and compound sites). As instances, soundness of the transform of any validator from round-by-round soundness, `(Q + budget) * error` in a random oracle on all typed histories, also for adaptively chosen statements and decoded challenges; the imported Sumcheck verifier's transform at `(Q + n) / \|F\|`, with composition theorems whose only premise about a compiled verifier is its construction equality, discharged for the compiled Sumcheck proof Entry. Law records of realized decoding laws with five constructors and the gated accepted-value decoder; raw answers by the last event and the lifting of uniform-sort certificates; binding codecs over typed public-value binding events, which establish statement determination'''
