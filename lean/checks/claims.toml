[[proved]]
subject = "GKR"
result = '''
The plain verifier of the GKR library has a round-by-round certificate composed per phase (ArkLib's degree-two successor bound for the layer rounds, Schwartz–Zippel on a line for the line challenge); its transform accepts claimed outputs other than the circuit's with probability at most `(Q + width + layers (2 width + 1)) max 2 width / \|F\|` in a random oracle on all typed histories. The composed construction and projection check accepts the compiled GKR proof Entry, whose instructions read as the plain verifier on well-formed statements within the Entry's maxima (width and layers at most four), so its ideal interpretation inherits the bound for a fixed statement'''
owners = [["Multi-round security", "docs/spec/fiat-shamir-security.md#the-plain-gkr-verifier"], ["support", "docs/support.md"]]
theorems = [
  "ZkcSecurity.Examples.GkrFiatShamir.soundness",
  "ZkcExamples.Construction.GkrProof.compiled_transform",
  "ZkcSecurity.Examples.CompiledGkrFiatShamir.soundness",
]
subjects = ["gkr"]

[[proved]]
subject = "Multi-round Fiat–Shamir"
result = '''
Soundness over typed query sites: for any validator signature with a transcript interface whose sites decode key-dependent raw answers, possibly refusing, each oracle key is charged its site's error under the site's realized decoding law (exact, masking with refusal, KoalaBear low-bit masks, BLS12-381 reduction, proof-of-work-gated and compound sites). As instances, soundness of the transform of any validator from round-by-round soundness, `(Q + budget) * error` in a random oracle on all typed histories, also for adaptively chosen statements and decoded challenges; the imported Sumcheck verifier's transform at `(Q + n) / \|F\|`, with composition theorems whose only premise about a compiled verifier is its construction equality, discharged for the compiled Sumcheck proof Entry'''
owners = [["Multi-round security", "docs/spec/fiat-shamir-security.md#typed-query-sites"], ["support", "docs/support.md"]]
theorems = [
  "ZkcSecurity.FiatShamir.Typed.adaptive_soundness_charged",
  "ZkcSecurity.FiatShamir.Typed.adaptive_soundness_weighted",
  "ZkcSecurity.FiatShamir.adaptive_soundness",
  "ZkcSecurity.Examples.SumcheckFiatShamir.compiled_adaptive_soundness",
]

[[proved]]
subject = "FRI low-degree test"
