name = "zkc_applications"
version = "0.0.0"
defaultTargets = ["ZkcApplications", "ZkcApplicationsTests"]

[leanOptions]
autoImplicit = false
warningAsError = true

[[require]]
name = "zkc_verification"
path = "../verification"

[[require]]
name = "zkc_arklib"
path = "../adapters/arklib"

[[require]]
name = "zkc_clean"
path = "../adapters/clean"

[[lean_lib]]
name = "ZkcApplications"
roots = ["Zkc.Applications"]
globs = ["Zkc.Applications.+"]
requiresModuleSystem = true

[[lean_lib]]
name = "ZkcApplicationsTests"
roots = ["Zkc.Tests.Applications"]
globs = ["Zkc.Tests.Applications.+"]
allowNonModules = true

[[lean_exe]]
name = "command-clean"
root = "Zkc.Applications.Clean"
supportInterpreter = true
