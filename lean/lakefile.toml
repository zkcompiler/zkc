name = "zkc"
version = "0.0.0"
defaultTargets = ["Zkc", "ZkcExamples", "ZkcTools", "ZkcAudit", "ZkcTests", "common-source", "constructed-source", "import-headers"]

[leanOptions]
autoImplicit = false
warningAsError = true

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "d13f23b723b8a846827a245b89c10fc7d3f11612"

[[lean_lib]]
name = "Zkc"
globs = ["Zkc", "Zkc.+"]
requiresModuleSystem = true

[[lean_lib]]
name = "ZkcExamples"
globs = ["ZkcExamples.NativePrograms.+"]
requiresModuleSystem = true

[[lean_lib]]
name = "ZkcTools"
globs = ["ZkcTools.JsonSupport", "ZkcTools.CommonSource.Reference", "ZkcTools.Constructed.Replay"]
requiresModuleSystem = true

[[lean_exe]]
name = "common-source"
root = "ZkcTools.CommonSource"

[[lean_exe]]
name = "constructed-source"
root = "ZkcTools.Constructed"

[[lean_exe]]
name = "import-headers"
root = "ZkcTools.ImportHeaders"

[[lean_lib]]
name = "ZkcAudit"
roots = ["ZkcTools.DeclarationAudit"]
allowNonModules = true

[[lean_lib]]
name = "ZkcTests"
roots = ["Tests"]
globs = ["Tests.+"]
allowNonModules = true
