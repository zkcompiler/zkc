name = "zkc"
version = "0.0.0"
defaultTargets = ["Zkc", "ZkcExamples", "ZkcTools", "ZkcAudit", "ZkcTests", "common-source", "structured-source", "import-headers", "declaration-records"]

[leanOptions]
autoImplicit = false
warningAsError = true

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "56a005855ea17e0b0958f73ec801ae140b0a1679"

[[lean_lib]]
name = "Zkc"
globs = ["Zkc", "Zkc.+"]
requiresModuleSystem = true

[[lean_lib]]
name = "ZkcExamples"
globs = ["ZkcExamples.+"]
requiresModuleSystem = true

[[lean_lib]]
name = "ZkcTools"
globs = ["ZkcTools.JsonSupport", "ZkcTools.ProofAccount", "ZkcTools.CommonSource.Reference", "ZkcTools.StructuredSource.*", "ZkcTools.SourceClaims.+", "ZkcTools.ConstructionBindings.+"]
requiresModuleSystem = true

[[lean_exe]]
name = "common-source"
root = "ZkcTools.CommonSource"

[[lean_exe]]
name = "import-headers"
root = "ZkcTools.ImportHeaders"

[[lean_exe]]
name = "structured-source"
root = "checks.StructuredSource"

[[lean_lib]]
name = "ZkcAudit"
roots = ["ZkcTools.DeclarationAudit"]
allowNonModules = true

[[lean_lib]]
name = "ZkcTests"
roots = ["Tests"]
globs = ["Tests.+"]
allowNonModules = true

[[lean_exe]]
name = "declaration-records"
root = "checks.DeclarationRecords"
supportInterpreter = true
