  "ZkcExamples.Executable.SchnorrProof.helpersSorted",
]

[scalar]
contract = "schnorr.verifier/0"
namespace = "Zkc.Protocols.Schnorr.Common"
module = "Zkc.Protocols.Schnorr.Common"
binders = "(base key : G) (service : Nat)"
arguments = "base key service"
unfold = ["experiment"]
group = true

[scalar.inputs]
base = ["base", "group"]
key = ["key", "group"]
service = ["service", "service"]

[scalar.properties.perfect-completeness]
theorem = "perfect_completeness"
experiment = "interactive.causal-transcripts/0"
premises = ["honest abstract response and commitment", "public key = secret scalar times base"]

[scalar.properties.special-soundness]
theorem = "special_soundness"
experiment = "interactive.causal-transcripts/0"
premises = ["same commitment", "two distinct challenges", "both transcripts accept"]

[scalar.properties.honest-verifier-zero-knowledge]
theorem = "honest_verifier_zero_knowledge"
experiment = "interactive.honest-verifier-view/0"
premises = ["public key = secret scalar times base", "uniform prover nonce and simulator response",
            "honest challenge fixed independently of nonce", "public one-session transcript and verifier outcome"]
module = "ZkcSecurity.VCVio.Schnorr"
context = "[SampleableType F] "
consumer = "ZkcSecurity.VCVio.Schnorr.honest_verifier_zero_knowledge"

[lean]
namespace = "ZkcSecurity.Examples.Subjects.Schnorr"
imports = ["ZkcSecurity.Examples.Subjects.Schnorr.Registration"]
