  "ZkcSecurity.Examples.ExecutableSchnorrFiatShamir.acceptance_le",
  "ZkcSecurity.Examples.CompiledSchnorrFiatShamir.knowledge_soundness",
  "ZkcExamples.Executable.SchnorrProof.accepted",
  "ZkcExamples.Executable.SchnorrProof.native_checked",
  "ZkcExamples.Executable.SchnorrProof.domain_prunes",
  "ZkcExamples.Executable.SchnorrProof.executable_validate",
  "ZkcExamples.Executable.SchnorrProof.executable_rejects",
  "ZkcExamples.Executable.SchnorrProof.executable_transform",
  "ZkcExamples.Executable.SchnorrProof.schedule_source",
  "ZkcExamples.Construction.SchnorrProof.compiled_transform",
  "ZkcExamples.Construction.SchnorrDomainConnection.participant_values",
  "Zkc.Executable.DomainVM.checked_execute_static",
  "Zkc.Executable.DomainVM.checked_validate_rejects_static",
  "Zkc.Executable.DomainVM.checked_execute_metered",
  "Zkc.Executable.DomainVM.checked_validate_metered",
  "Zkc.Executable.DomainVM.checked_validate_prunes",
  "Zkc.Executable.DomainVM.metered_sufficient",
