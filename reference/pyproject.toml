[project]
name = "zkc-reference"
version = "0"
description = "zkc reference twin: PIR judgments, canonical encodings, and OIR toy execution"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = []


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["oracle"]

[tool.ruff]
# The twin is judged by byte parity against the C++ implementation and
# the specification, not by style; lint only for actual defects.
lint.select = ["E4", "E7", "E9", "F"]
