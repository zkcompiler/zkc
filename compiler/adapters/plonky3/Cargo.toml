# Standalone Plonky3 AIR adapter workspace. Its upstream pins and lockfile are
# separate from the root native workspace; no Plonky3 AIR type enters the
# shared compiler or runtime model.
[workspace]
members = ["exporter", "client", "driver"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
# Plonky3 0.5.1 is upstream commit 45e0ffe4d294816755522dd2cf7c38d6bcd701ce.
# It is the family the native KoalaBear provider pins in crates/zkc-backends.
p3-air = "=0.5.1"
p3-commit = "=0.5.1"
p3-field = "=0.5.1"
p3-koala-bear = "=0.5.1"
p3-matrix = "=0.5.1"
serde_json = "=1.0.151"
sha2 = "=0.10.9"
zkc-plonky3-air = { path = "exporter" }
zkc-plonky3-air-client = { path = "client" }
# Native admission and evaluation are optional consumers of exported assets.
zkc-runtime = { path = "../../../crates/zkc-runtime" }
zkc-backends = { path = "../../../crates/zkc-backends" }

[workspace.lints.rust]
unsafe_code = "forbid"
