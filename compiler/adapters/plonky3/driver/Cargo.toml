[package]
name = "zkc-plonky3-air-driver"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Fixture driver and differential checks for the Plonky3 AIR adapter"

[[bin]]
name = "zkc-plonky3-air-fixtures"
path = "src/main.rs"

[features]
# Differential checks against the native ring admission and KoalaBear provider.
native = ["dep:zkc-runtime", "dep:zkc-backends"]

[dependencies]
p3-air.workspace = true
p3-field.workspace = true
p3-koala-bear.workspace = true
p3-matrix.workspace = true
zkc-plonky3-air.workspace = true
zkc-plonky3-air-client.workspace = true
zkc-runtime = { workspace = true, optional = true }
zkc-backends = { workspace = true, optional = true }

[dev-dependencies]
# The upstream two-adic domain's Lagrange selectors, as the STARK uses them.
p3-commit.workspace = true
serde_json.workspace = true

[[test]]
name = "native"
required-features = ["native"]

[lints]
workspace = true
