[package]
name = "zkc-evm-test-runner"
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
publish = false

# This test adapter must never extend the production workspace dependency graph.
[workspace]

[dependencies]
revm = { version = "=43.0.3", default-features = false, features = ["std", "portable", "secp256k1", "c-kzg"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[bin]]
name = "zkc-evm-test-runner"
path = "src/main.rs"
