name: Build and check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      scope:
        description: Validation scope
        type: choice
        default: quick
        options: [quick, all, main, optional, fresh, cache]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  quick:
    name: Quick source and harness checks
    if: github.event_name != 'workflow_dispatch' || inputs.scope == 'quick' || inputs.scope == 'all'
    runs-on: [self-hosted, linux, x64, zkc-ci]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/nix
      - name: Check sources without building project tools
        run: |
          mkdir -p build/reports
          nix develop .#quick --command bash .github/scripts/check-quick.sh \
            2>&1 | tee build/reports/quick-checks.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: quick-checks-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reports/
          retention-days: 14

  native:
    needs: quick
    name: Native build and execution
    if: github.event_name != 'workflow_dispatch'
    runs-on: [self-hosted, linux, x64, zkc-ci]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select native changes
        id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: python3 .github/scripts/select-native-changes.py
      - uses: ./.github/actions/nix
        if: steps.changes.outputs.native == 'true'
      - name: Verify compiler cache correctness
        if: steps.changes.outputs.native == 'true'
        run: nix build -L --no-link .#compiler-cache-check
      - name: Select Rust checks from package inputs
        id: rust
        if: steps.changes.outputs.native == 'true'
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: python3 .github/scripts/select-rust-check.py
      - name: Check Rust with isolated incremental outputs
        if: steps.changes.outputs.native == 'true' && steps.rust.outputs.needed != 'false'
        run: |
          mkdir -p build/reports
          nix develop --command bash .github/scripts/check-rust-incremental.sh \
            2>&1 | tee build/reports/rust-checks.log
      - name: Check installed application, SDK and C++ formatting
        if: steps.changes.outputs.native == 'true'
        run: |
          mkdir -p build/reports
          nix build -L --keep-going --no-link \
            .#checks.x86_64-linux.application \
            .#checks.x86_64-linux.compiler-consumer \
            .#checks.x86_64-linux.rust-consumer \
            .#checks.x86_64-linux.sdk \
            .#checks.x86_64-linux.sources \
            .#checks.x86_64-linux.format \
            2>&1 | tee build/reports/native-checks.log
      - name: Execute affected protocol families with invalid-input controls
        if: steps.changes.outputs.native == 'true'
        env:
          SMOKE_CHECKS: ${{ steps.changes.outputs.smoke }}
        run: |
          read -ra checks <<< "$SMOKE_CHECKS"
          if (( ${#checks[@]} )); then
            nix build -L --keep-going --no-link "${checks[@]}" \
              2>&1 | tee build/reports/protocol-smoke.log
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.changes.outputs.native == 'true'
        with:
          name: native-checks-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reports/
          retention-days: 14


  main:
    name: Full main packages and checks
    if: github.event_name == 'workflow_dispatch' && (inputs.scope == 'all' || inputs.scope == 'main' || inputs.scope == 'cache')
    runs-on: [self-hosted, linux, x64, zkc-ci]
    timeout-minutes: ${{ inputs.scope == 'cache' && 360 || 180 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the public source tree
        run: bash .github/scripts/public-tree-guard.sh
      - uses: ./.github/actions/nix
      - name: Record selected tools and lock
        run: |
          mkdir -p build/reports/environment
          nix develop --profile build/nix-dev --command python3 scripts/doctor.py --json \
            | tee build/reports/environment/tools.json
          cp flake.lock build/reports/environment/
          nix config show sandbox > build/reports/environment/sandbox.txt
          test "$(cat build/reports/environment/sandbox.txt)" = true
      - name: Check all main packages in the sandbox
        run: nix flake check -L --keep-going 2>&1 | tee build/reports/nix-check.log
      - name: Require reuse without builds or downloads
        if: inputs.scope == 'cache'
        run: bash .github/scripts/check-nix-cache.sh
      - name: Retain successful check records
        run: |
          nix build .#checks.x86_64-linux.project --out-link build/nix-project
          cp -RL build/nix-project/reports build/reports/packaged
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: main-checks-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reports/
          retention-days: 14

  optional:
    name: Optional (${{ matrix.package }})
    if: github.event_name == 'workflow_dispatch' && (inputs.scope == 'all' || inputs.scope == 'optional')
    runs-on: [self-hosted, linux, x64, zkc-ci]
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        package: [lean-checks, lean-toolchain-checks, applications, llzk, compiler-sanitize]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/nix
      - name: Build and test the selected integration
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          mkdir -p build/reports
          nix build -L ".#$PACKAGE" --out-link "build/nix-$PACKAGE" \
            2>&1 | tee "build/reports/$PACKAGE.log"
          if [ -d "build/nix-$PACKAGE/reports" ]; then
            cp -RL "build/nix-$PACKAGE/reports" "build/reports/$PACKAGE"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: optional-${{ matrix.package }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reports/
          retention-days: 14

  fresh:
    name: Formal source rebuild without project output reuse
    if: github.event_name == 'workflow_dispatch' && (inputs.scope == 'all' || inputs.scope == 'fresh')
    runs-on: [self-hosted, linux, x64, zkc-ci]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/nix
      - name: Rebuild the formal package chain from sources
        env:
          ZKC_CI_FRESH_RUN: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          mkdir -p build/reports
          nix build -L --no-link --impure --expr '
            let
              project = builtins.getFlake (toString ./.);
              fresh = import ./nix/fresh-formal.nix {
                packages = project.packages.x86_64-linux;
                lib = project.inputs.nixpkgs.lib;
                runId = builtins.getEnv "ZKC_CI_FRESH_RUN";
              };
            in fresh.applications
          ' 2>&1 | tee build/reports/formal-fresh.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: lean-fresh-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reports/
          retention-days: 30

  required:
    name: ${{ github.event_name == 'workflow_dispatch' && 'Selected manual checks' || 'Required CI' }}
    if: always()
    needs: [quick, native, main, optional, fresh]
    runs-on: [self-hosted, linux, x64, zkc-ci]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require every selected job to succeed
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
          CI_EVENT: ${{ github.event_name }}
          CI_SCOPE: ${{ inputs.scope }}
        run: python3 .github/scripts/require-checks.py
