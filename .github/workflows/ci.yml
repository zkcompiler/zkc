name: Build and check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      scope:
        description: Validation scope
        type: choice
        default: quick
        options: [quick, all, main, optional, fresh, cache]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  quick:
    name: Quick source and harness checks
    if: github.event_name != 'workflow_dispatch' || inputs.scope == 'quick' || inputs.scope == 'all'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/nix
        with:
          cache: "false"
      - name: Check sources without building project tools
        run: |
          mkdir -p build/reports
          nix develop .#quick --command bash .github/scripts/check-quick.sh \
            2>&1 | tee build/reports/quick-checks.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: quick-checks-${{ github.run_id }}
          path: build/reports/
          retention-days: 14

  native:
    name: Native build and execution
    if: github.event_name != 'workflow_dispatch'
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-24.04' || vars.ZKC_MAIN_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select native changes
        id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: python3 .github/scripts/select-native-changes.py
      - name: Reserve build space
        if: steps.changes.outputs.native == 'true' && runner.environment == 'github-hosted'
        run: |
          # Leave room for downloaded toolchains and concurrent native builds.
          available_kib=$(df --output=avail -k / | tail -n 1)
          if (( available_kib < 20 * 1024 * 1024 )); then
            sudo rm -rf /usr/local/lib/android
          fi
          df -h /
      - uses: ./.github/actions/nix
        if: steps.changes.outputs.native == 'true'
      - name: Check Rust, installed application, SDK and C++ formatting
        if: steps.changes.outputs.native == 'true'
        run: |
          mkdir -p build/reports
          nix build -L --keep-going --no-link \
            .#checks.x86_64-linux.rust \
            .#checks.x86_64-linux.application \
            .#checks.x86_64-linux.compiler-consumer \
            .#checks.x86_64-linux.format \
            2>&1 | tee build/reports/native-checks.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.changes.outputs.native == 'true'
        with:
          name: native-checks-${{ github.run_id }}
          path: build/reports/
          retention-days: 14


  main:
    name: Full main packages and checks
    if: github.event_name == 'workflow_dispatch' && (inputs.scope == 'all' || inputs.scope == 'main' || inputs.scope == 'cache')
    runs-on: ${{ vars.ZKC_MAIN_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: ${{ inputs.scope == 'cache' && 360 || 180 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the public source tree
        run: bash .github/scripts/public-tree-guard.sh
      - name: Reserve space for LLVM source builds
        if: runner.environment == 'github-hosted'
        run: sudo rm -rf /usr/local/lib/android
      - uses: ./.github/actions/nix
      - name: Require restoration on a fresh project store
        if: github.event_name == 'workflow_dispatch' && inputs.scope == 'cache'
        run: bash .github/scripts/check-nix-cache.sh
      - name: Record selected tools and lock
        run: |
          mkdir -p build/reports/environment
          nix develop --profile build/nix-dev --command python3 scripts/doctor.py --json \
            | tee build/reports/environment/tools.json
          cp flake.lock build/reports/environment/
          nix config show sandbox > build/reports/environment/sandbox.txt
          test "$(cat build/reports/environment/sandbox.txt)" = true
      - name: Check all main packages in the sandbox
        run: nix flake check -L --keep-going 2>&1 | tee build/reports/nix-check.log
      - name: Retain successful check records
        run: |
          nix build .#checks.x86_64-linux.project --out-link build/nix-project
          cp -RL build/nix-project/reports build/reports/packaged
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: main-checks-${{ github.run_id }}
          path: build/reports/
          retention-days: 14

  optional:
    name: Optional (${{ matrix.package }})
    if: github.event_name == 'workflow_dispatch' && (inputs.scope == 'all' || inputs.scope == 'optional')
    runs-on: ${{ vars.ZKC_OPTIONAL_RUNNER || vars.ZKC_MAIN_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        package: [lean-checks, lean-toolchain-checks, arklib, llzk, compiler-sanitize]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reserve build space
        if: runner.environment == 'github-hosted'
        run: sudo rm -rf /usr/local/lib/android
      - uses: ./.github/actions/nix
      - name: Build and test the selected integration
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          mkdir -p build/reports
          nix build -L ".#$PACKAGE" --out-link "build/nix-$PACKAGE" \
            2>&1 | tee "build/reports/$PACKAGE.log"
          if [ -d "build/nix-$PACKAGE/reports" ]; then
            cp -RL "build/nix-$PACKAGE/reports" "build/reports/$PACKAGE"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: optional-${{ matrix.package }}-${{ github.run_id }}
          path: build/reports/
          retention-days: 14

  fresh:
    name: Formal source rebuild without a project cache
    if: github.event_name == 'workflow_dispatch' && (inputs.scope == 'all' || inputs.scope == 'fresh')
    runs-on: ${{ vars.ZKC_FRESH_RUNNER || vars.ZKC_OPTIONAL_RUNNER || vars.ZKC_MAIN_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reserve build space
        if: runner.environment == 'github-hosted'
        run: sudo rm -rf /usr/local/lib/android
      - uses: ./.github/actions/nix
        with:
          cache: "false"
      - name: Require a fresh project store
        run: |
          for package in lean arklib; do
            output=$(nix eval --raw ".#$package.outPath")
            if nix-store --check-validity "$output" 2>/dev/null; then
              echo "::error::$package already exists in this store. Configure ZKC_FRESH_RUNNER with an ephemeral runner or a fresh Nix store; disabling cache restore alone does not force source reconstruction."
              exit 1
            fi
          done
      - name: Build main and optional Lean packages from sources
        run: |
          mkdir -p build/reports
          nix build -L .#lean .#arklib --no-link \
            --option substituters https://cache.nixos.org \
            2>&1 | tee build/reports/lean-fresh.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: lean-fresh-${{ github.run_id }}
          path: build/reports/
          retention-days: 30
