name: Nix environment
description: Install upstream Nix and optionally restore the GitHub Actions Nix store cache
inputs:
  cores:
    description: Parallel workers within one Nix build
    default: "4"
  max-jobs:
    description: Concurrent Nix builds on this runner
    default: "1"
  cache:
    description: Read and write build outputs in the GitHub Actions cache
    default: "true"
  cache-scope:
    description: Separate store snapshots for jobs with different build graphs
    default: "${{ github.job }}"
  cache-save:
    description: Save a new snapshot after a successful job
    default: "true"
  require-cache:
    description: Require an empty project store before restoring cached results
    default: "false"
runs:
  using: composite
  steps:
    - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      with:
        install_url: https://releases.nixos.org/nix/nix-2.35.2/install
        enable_kvm: false
        extra_nix_config: |
          experimental-features = nix-command flakes
          sandbox = true
          sandbox-fallback = false
          max-jobs = ${{ inputs.max-jobs }}
          cores = ${{ inputs.cores }}
    - name: Report Nix version and verify settings
      env:
        NIX_EXPECTED_CORES: ${{ inputs.cores }}
        NIX_EXPECTED_JOBS: ${{ inputs.max-jobs }}
      shell: bash
      run: |
        # Existing installations may use a newer release. Check the settings
        # and actual build isolation below, not an arbitrary version equality.
        nix --version
        for setting in 'sandbox true' 'sandbox-fallback false' "max-jobs $NIX_EXPECTED_JOBS" "cores $NIX_EXPECTED_CORES"; do
          read -r name expected <<< "$setting"
          if [ "$(nix config show "$name")" != "$expected" ]; then
            echo "::error::The runner must configure Nix $name = $expected. The installer does not reconfigure an existing installation."
            exit 1
          fi
        done
    - name: Require an empty project store before restoration
      if: inputs.require-cache == 'true'
      shell: bash
      run: bash .github/scripts/check-nix-cache.sh --assert-empty
    - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
      if: inputs.cache == 'true'
      with:
        primary-key: nix-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cache-scope }}-${{ hashFiles('flake.lock') }}-${{ github.sha }}
        restore-prefixes-first-match: |
          nix-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cache-scope }}-${{ hashFiles('flake.lock') }}-
        save: ${{ inputs.cache-save }}
        # Successful build graphs receive temporary GC roots. Remove stale
        # results before snapshotting, including results from earlier commits.
        gc-max-store-size-linux: 0
    - name: Enable retention of successful build graphs
      if: inputs.cache == 'true' && inputs.cache-save == 'true'
      shell: bash
      run: echo "ZKC_NIX_CACHE_ROOTS=$RUNNER_TEMP/zkc-nix-cache-roots" >> "$GITHUB_ENV"
    - name: Verify effective build isolation
      shell: bash
      run: |
        touch /tmp/zkc-sandbox-ambient
        trap 'rm -f /tmp/zkc-sandbox-ambient' EXIT
        nix build .#checks.x86_64-linux.sandbox --no-link
        nix build .#checks.x86_64-linux.sandbox --no-link --rebuild
