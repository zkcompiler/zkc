[package]
name = "zkc-rt"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
description = "Runtime support for zkc-emitted endpoints: verdict vocabulary, proof cursor, prover observables, and the profile supplier sets as concrete Rust types."

[features]
default = []
# The toy supplier set: SHA-256 chaining duplex, big-endian 8-byte codecs.
toy = ["dep:sha2"]
# The plonky3 supplier set: the lenpad duplex over the pinned upstream
# Poseidon2-16 BabyBear permutation, and the FRI leaf fills — commit,
# fold, interpolation, and reduction assembled from the pinned public
# kernels. Default features only: nothing here may enable
# p3-maybe-rayon's `parallel`, because the deterministic least-witness
# grind agreement with the replay runner depends on both dependency
# graphs staying serial.
plonky3 = [
  "dep:p3-baby-bear",
  "dep:p3-field",
  "dep:p3-symmetric",
  "dep:p3-matrix",
  "dep:p3-dft",
  "dep:p3-commit",
  "dep:p3-merkle-tree",
  "dep:p3-fri",
  "dep:p3-util",
]
# The BLS12-381 KZG supplier set: fr/g1 codecs and the two opaque check
# predicates, over the arkworks curve implementation (the borrowed kernel;
# its compressed point form is the standard big-endian one the codec names).
kzg = ["dep:ark-bls12-381", "dep:ark-ec", "dep:ark-ff", "dep:ark-serialize"]
# Zero witness payloads on drop. Off by default because memory hygiene is a
# claimable property only when the whole call chain cooperates: a build that
# enables this says so, and one that does not makes no claim either way.
zeroize = ["dep:zeroize"]

[dependencies]
sha2 = { version = "=0.10.9", optional = true }
# Exactly the replay harness's pin (evaluation/upstream/plonky3-replay):
# one upstream revision for the whole repository.
p3-baby-bear = { git = "https://github.com/Plonky3/Plonky3.git", rev = "3da346791c813433b201299afc3d10bf42f8a078", optional = true }
p3-field = { git = "https://github.com/Plonky3/Plonky3.git", rev = "3da346791c813433b201299afc3d10bf42f8a078", optional = true }
p3-symmetric = { git = "https://github.com/Plonky3/Plonky3.git", rev = "3da346791c813433b201299afc3d10bf42f8a078", optional = true }
p3-matrix = { git = "https://github.com/Plonky3/Plonky3.git", rev = "3da346791c813433b201299afc3d10bf42f8a078", optional = true }
p3-dft = { git = "https://github.com/Plonky3/Plonky3.git", rev = "3da346791c813433b201299afc3d10bf42f8a078", optional = true }
p3-commit = { git = "https://github.com/Plonky3/Plonky3.git", rev = "3da346791c813433b201299afc3d10bf42f8a078", optional = true }
p3-merkle-tree = { git = "https://github.com/Plonky3/Plonky3.git", rev = "3da346791c813433b201299afc3d10bf42f8a078", optional = true }
p3-fri = { git = "https://github.com/Plonky3/Plonky3.git", rev = "3da346791c813433b201299afc3d10bf42f8a078", optional = true }
p3-util = { git = "https://github.com/Plonky3/Plonky3.git", rev = "3da346791c813433b201299afc3d10bf42f8a078", optional = true }
ark-bls12-381 = { version = "=0.6.0", optional = true, default-features = false, features = ["curve"] }
ark-ec = { version = "=0.6.0", optional = true, default-features = false }
ark-ff = { version = "=0.6.0", optional = true, default-features = false }
ark-serialize = { version = "=0.6.0", optional = true, default-features = false }
zeroize = { version = "=1.9.0", optional = true, default-features = false, features = ["alloc"] }

[dev-dependencies]
serde_json = "=1.0.151"

[[example]]
name = "kzg_vectors"
required-features = ["kzg", "toy"]
