[workspace]
members = [
  "crates/zkc-catalog",
  "crates/zkc-runtime",
  "crates/zkc",
  "crates/zkc-cli",
  "crates/zkc-web",
  "crates/zkc-kernels",
  "crates/zkc-cpu",
  "crates/zkc-test-support",
  "crates/zkc-test-drivers",
  "crates/zkc-benchmarks",
]
default-members = ["crates/zkc-cli"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
toml = { version = "=1.1.8", default-features = false, features = ["parse", "serde", "std"] }
serde_json = { version = "=1.0.152", features = ["arbitrary_precision", "unbounded_depth"] }
num-bigint = "=0.5.1"
tempfile = "=3.27.0"
unicode-normalization = "=0.1.25"
# Nonblocking regular-file ingress for native hosts.
libc = "=0.2.190"
# Safe directory-relative input references; reuses the locked tempfile dependency.
rustix = { version = "=1.1.5", features = ["fs"] }
zkc-test-support = { path = "crates/zkc-test-support" }

# Native integration versions are owned here; each crate selects its features.
ark-bls12-381 = "=0.6.0"
ark-bn254 = "=0.6.0"
# ark-ec 0.6 parallel MSM constructs private pools, bypassing CpuExecution.
# Keep curves/PCS serial; field and FFT parallel iterators use the installed pool.
# Do not enable ark-ec/parallel through another dependency (including PCS defaults).
ark-ec = { version = "=0.6.0", default-features = false, features = ["std"] }
ark-ff = { version = "=0.6.0", default-features = false, features = ["std"] }
ark-poly = { version = "=0.6.0", default-features = false, features = ["std"] }
ark-poly-commit = { version = "=0.6.0", default-features = false, features = ["std"] }
ark-serialize = "=0.6.0"
ark-std = "=0.6.0"
# Safe BLS12-381 arithmetic wrapper; keep foreign kernels on the caller thread.
blst = { version = "=0.3.17", features = ["no-threads"] }
blstrs = { version = "=0.7.1", default-features = false }
halo2curves-axiom = { version = "=0.7.3", default-features = false }
group = "=0.13.0"
curve25519-dalek = "=5.0.0"
merlin = "=3.0.0"
p3-baby-bear = "=0.8.0"
p3-goldilocks = "=0.8.0"
p3-binary-field = "=0.8.0"
p3-commit = "=0.8.0"
p3-dft = "=0.8.0"
rayon = "=1.12.0"
p3-field = "=0.8.0"
p3-keccak = "=0.8.0"
p3-koala-bear = "=0.8.0"
p3-matrix = "=0.8.0"
p3-monty-31 = "=0.8.0"
p3-merkle-tree = "=0.8.0"
p3-poseidon2 = "=0.8.0"
p3-symmetric = "=0.8.0"
rand = "=0.10.3"
serde = "=1.0.229"
sha2 = "=0.11.0"
sha3 = "=0.12.0"
shake = "=0.1.0"
spongefish = { version = "=0.8.0", default-features = false }
# Independent external-proof oracle; production providers use the current pin.
spongefish-074 = { package = "spongefish", version = "=0.7.4", default-features = false }

# OpenVM adapters use the separately pinned 0.4.3 family.
p3-baby-bear-043 = { package = "p3-baby-bear", version = "=0.4.3" }
p3-field-043 = { package = "p3-field", version = "=0.4.3" }
p3-symmetric-043 = { package = "p3-symmetric", version = "=0.4.3" }
p3-challenger-043 = { package = "p3-challenger", version = "=0.4.3" }

zkc = { path = "crates/zkc" }
zkc-catalog = { path = "crates/zkc-catalog" }
zkc-runtime = { path = "crates/zkc-runtime" }
zkc-cpu = { path = "crates/zkc-cpu" }
zkc-kernels = { path = "crates/zkc-kernels" }

[workspace.lints.rust]
unsafe_code = "forbid"

# Browser deployment profile; keep ordinary native release builds unchanged.
[profile.web]
inherits = "release"
lto = "thin"
codegen-units = 1
