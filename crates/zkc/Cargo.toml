[package]
name = "zkc"
version = "0.0.0"
edition.workspace = true
license.workspace = true
[dependencies]
zkc-format.workspace = true
zkc-catalog.workspace = true
toml = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
zkc-runtime = { workspace = true, optional = true }
zkc-cpu = { workspace = true, default-features = false, optional = true }
zkc-kernels = { workspace = true, default-features = false, optional = true }
sha2.workspace = true
serde_json.workspace = true
tempfile = { workspace = true, optional = true }
unicode-normalization.workspace = true
[build-dependencies]
sha2.workspace = true
serde_json.workspace = true
[lints]
workspace = true
[dev-dependencies]
ark-std = { workspace = true, features = ["getrandom"] }
zkc-test-support.workspace = true
[features]
default = ["cpu", "project", "parallel"]
cpu = ["dep:zkc-runtime", "dep:zkc-cpu", "dep:zkc-kernels", "dep:rand"]
files = ["dep:tempfile", "dep:libc", "dep:rustix"]
project = ["files", "dep:toml"]
parallel = ["cpu", "zkc-cpu/parallel", "zkc-kernels/parallel"]
execution-counts = ["cpu", "zkc-runtime/execution-counts"]
test-utils = ["cpu", "zkc-cpu/test-utils"]

[target.'cfg(unix)'.dependencies]
libc = { workspace = true, optional = true }
rustix = { workspace = true, optional = true }

[[test]]
name = "cpu_installation"
required-features = ["cpu"]

[[test]]
name = "cpu_execution"
required-features = ["cpu"]

[[test]]
name = "native_capacity"
required-features = ["cpu"]

[[test]]
name = "unicode_bindings"
required-features = ["cpu"]
