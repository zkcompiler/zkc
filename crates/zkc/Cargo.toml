[package]
name = "zkc"
version = "0.0.0"
edition.workspace = true
license.workspace = true
[dependencies]
toml = { workspace = true, optional = true }
rand.workspace = true
serde = { workspace = true, features = ["derive"] }
zkc-runtime.workspace = true
zkc-cpu = { workspace = true, default-features = false }
zkc-kernels = { workspace = true, default-features = false }
sha2.workspace = true
serde_json.workspace = true
tempfile = { workspace = true, optional = true }
unicode-normalization.workspace = true
[build-dependencies]
sha2.workspace = true
serde_json.workspace = true
[lints]
workspace = true
[dev-dependencies]
ark-std = { workspace = true, features = ["getrandom"] }
zkc-test-support.workspace = true
[features]
default = ["parallel", "files", "project"]
files = ["dep:tempfile", "dep:libc", "dep:rustix"]
project = ["files", "dep:toml"]
parallel = ["zkc-cpu/parallel", "zkc-kernels/parallel"]
execution-counts = ["zkc-runtime/execution-counts"]
test-utils = ["zkc-cpu/test-utils"]

[target.'cfg(unix)'.dependencies]
libc = { workspace = true, optional = true }
rustix = { workspace = true, optional = true }
