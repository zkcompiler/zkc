[package]
name = "zkc-web"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false
description = "In-memory browser proof adapter over the zkc SDK"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
zkc = { workspace = true, default-features = false, features = ["cpu"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
wasm-bindgen = "=0.2.129"

# Platform entropy belongs to the final application, not the numerical providers.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom-02 = { package = "getrandom", version = "=0.2.17", features = ["js"] }
getrandom-04 = { package = "getrandom", version = "=0.4.3", features = ["wasm_js"] }

[lints]
workspace = true
