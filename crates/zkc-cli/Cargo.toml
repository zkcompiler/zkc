[package]
name = "zkc-cli"
version = "0.0.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "zkc"
path = "src/main.rs"

[dependencies]
zkc.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true

[dev-dependencies]
ark-std = { workspace = true, features = ["getrandom"] }
zkc-native.workspace = true
zkc-kernels.workspace = true
zkc-runtime.workspace = true
zkc-test-support.workspace = true

[features]
execution-counts = ["zkc/execution-counts"]
test-utils = ["zkc/test-utils"]

[lints]
workspace = true
